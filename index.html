<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Meta tag essencial para jogos em dispositivos móveis (evita zoom e rolagem) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bodycam - Operação Abismo</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        color: #fff;
        font-family: monospace;
      }
      #game-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <!-- Contêiner onde o jogo em 3D será renderizado -->
    <div id="game-container"></div>

    <!-- Menu principal - Ocultado com style="display: none;" para pular direto pro jogo -->
    <div id="menu-overlay" style="display: none;">
      <div style="text-align: center; margin: auto; padding-top: 50%;">
        <h1 style="color: #ff3333; letter-spacing: 5px;">BODYCAM</h1>
        <p style="color: #888;">OPERAÇÃO ABISMO - SETOR 07</p>
        <br>
        <button id="btn-start" style="padding: 15px 30px; font-size: 16px; margin-bottom: 10px;">INICIAR OPERAÇÃO</button>
        <br>
        <button id="btn-config" style="padding: 15px 30px; font-size: 16px; background: transparent; color: #fff; border: 1px solid #555;">CONFIGURAÇÕES</button>
      </div>
    </div>

    <!-- Ponto de entrada do código Javascript -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
